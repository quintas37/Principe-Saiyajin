<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="style.css">
<meta charset="UTF-8">

<head>

</head>
<h2>Encuesta</h2>

<body>
  <div class="aviso">
    <form action="/procesar-datos" method="POST">

      <fieldset>
        <legend>Por favor Ingresa tus datos</legend>
        <!-- Campo de Texto-->
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required><br>
        <label for="nombre">Apellido Paterno:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu Apellido paterno" required><br>
        <label for="nombre">Apellido Paterno:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu Apellido materno" required><br>
       <label for="nombre">Fecha de registro:</label>
        <input type="datetime" id="nombre" name="fecha" placeholder="Ingresa la fecha" required><br>
        <br>
        <br>
        <!-- Campo de Número -->
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" min="1" max="120" placeholder="Ingresa tu edad" required>
        <br>
        <!-- Selección Única -->
        <label>Género (Selección única):</label>
        <div class="opciones">
          <input type="radio" id="genero_m" name="genero" value="masculino" required>
          <label for="genero_m">Masculino</label>

          <input type="radio" id="genero_f" name="genero" value="femenino">
          <label for="genero_f">Femenino</label>

          <input type="radio" id="genero_o" name="genero" value="otro">
          <label for="genero_o">Otro</label>
        </div>
        <br>
        <!-- Selección Única alternativa (Lista Desplegable) -->
        <label for="estado_civil">Estado Civil:</label>
        <select id="estado_civil" name="estado_civil" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="soltero">Soltero/a</option>
          <option value="casado">Casado/a</option>
          <option value="viudo/a">Otro</option>
          <option value="otro">Otro</option>
        </select>
      </fieldset><br>

      <fieldset>
        <legend>Por favor selecciona</legend>
        <!-- Selección Múltiple (Checkboxes) -->
        <label> ¿Cuál es tu sistema operativo favorito?:</label>
        <div class="opciones">
          <label><input type="radio" name="so" value="Windows">Windows</label><br>
          <label><input type="radio" name="so" value="Macoss">Mac Os</label><br>
          <label><input type="radio" name="so" value="Linux">Linux</label><br>
          <label><input type="radio" name="so" value="android">Android</label><br>
      </fieldset><br>

      <fieldset>
        <legend>Puedes elegir mas de una opción</legend>
        <!-- Selección Múltiple (Checkboxes) -->
        <label>¿Que tecnología utilizas? (selecciona las que correspondan)</label>
        <div class="opciones">
          <label><input type="checkbox" name="tech" value="html">HTML</label><br>
          <label><input type="checkbox" name="tech" value="css">CSS</label><br>
          <label><input type="checkbox" name="tech" value="phyton">Phyton</label><br>
          <label><input type="checkbox" name="tech" value="java">Java</label><br>
      </fieldset><br>
      <fielset>
        <legend>Tus comentarios son importantes</legend>
        <textarea name="comentarios" id="comentarios" cols="30" rows="5"
          placeholder="Escribe tus comentarios"></textarea><br>
      </fielset>
  </div>
  <!-- Botón de Envío -->
  <button type="submit">Enviar Datos</button>
  </form>

</body>

</html>
